[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peru-sdk"
version = "0.1.0a1"
description = "Clientes nativos para servicios del Estado peruano"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/DataScienceResearchPeru/peru-sdk-python"

[tool.setuptools.packages.find]
where = ["src"]
