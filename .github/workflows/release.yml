name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version
        type: boolean
        default: false
  pull_request:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: /var/tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python -m pip install -r .ci/requirements.txt
      - run: python .ci/check_release.py
        if: github.event_name == 'push' || inputs.publish
      - run: python .ci/test_release.py
      - run: python .ci/sync_upstream.py --check
      - name: Build and test isolated distributions
        run: |
          stage=$(mktemp -d /var/tmp/peru-python-release.XXXXXXXX)
          echo "SDK_DIST=$stage" >> "$GITHUB_ENV"
          python .ci/check_package.py --output "$stage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-release-${{ github.sha }}
          path: ${{ env.SDK_DIST }}
          retention-days: 30
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-release-${{ github.sha }}
          path: release
      - name: Verify artifacts
        run: sha256sum -c manifest/SHA256SUMS
        working-directory: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: release/dist/
